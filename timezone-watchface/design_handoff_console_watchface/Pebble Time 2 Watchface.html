<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pebble Time 2 — Watchface Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #e9e7e2; }
  * { -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="watchfaces.jsx"></script>
<script type="text/babel">
  const { useState } = React;

  // small frame so each 200×228 face reads as a screen, with a soft bezel.
  function Screen({ children }) {
    return (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 18 }}>
        <div style={{
          width: 200, height: 228, borderRadius: 14, overflow: 'hidden',
          boxShadow: '0 1px 0 rgba(0,0,0,0.04), 0 18px 40px -22px rgba(0,0,0,0.45)',
          outline: '1px solid rgba(0,0,0,0.06)',
        }}>
          {children}
        </div>
      </div>
    );
  }

  function App() {
    return (
      <DesignCanvas>
        <DCSection
          id="faces"
          title="Pebble Time 2 · Watchface"
          subtitle="200 × 228 e-paper · live clocks (Seattle / Dublin) · click the ⤢ icon on any frame to view it large">
          <DCArtboard id="console" label="1 · Console — dark grid" width={236} height={264}>
            <Screen><FaceConsole /></Screen>
          </DCArtboard>
          <DCArtboard id="stack" label="2 · Stack — maximal numerals" width={236} height={264}>
            <Screen><FaceStack /></Screen>
          </DCArtboard>
          <DCArtboard id="paper" label="3 · Paper — light & refined" width={236} height={264}>
            <Screen><FacePaper /></Screen>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
